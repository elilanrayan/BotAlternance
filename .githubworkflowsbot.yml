name: Bot Alternance Game Programming

on:
  schedule:
    - cron: "30 7,17 * * *" # 8h30 et 18h30 (heure de Paris en hiver)
  workflow_dispatch:         # Permet de lancer un test manuel en 1 clic

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: python bot.py

      - name: Sauvegarder les offres déjà vues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f seen_offers.json ]; then
            git add seen_offers.json
            git diff --staged --quiet || (git commit -m "Mise à jour seen_offers.json" && git push)
          fi